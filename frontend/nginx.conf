# This file is included in the http{} context (conf.d/default.conf), so the map
# used for WebSocket upgrades lives here.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Dataset / model uploads can be large (backend default MAX_UPLOAD_MB=25).
  client_max_body_size 32m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # API + WebSocket proxy.
  # The path prefix is preserved (no trailing slash on proxy_pass) because the
  # FastAPI app mounts every route under /api.
  # ---------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade for /api/traffic/ws (live metrics, predictions, alerts,
    # forecasts and simulation ticks).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long-lived streaming connections must not be cut by the default 60s read
    # timeout; the client sends a heartbeat every 25s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # SPA fallback — every client-side route resolves to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Immutable hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
